version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vendas_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_USER_PASSWORD: password
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vendas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vendas-network

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: vendas_evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:password@postgres:5432/vendas_db
      - AUTHENTICATION_API_KEY=sua-api-key-global-aqui
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vendas-network

volumes:
  postgres_data:
  evolution_instances:

networks:
  vendas-network:
    driver: bridge