services:
  postgres:
    image: postgres:16-alpine
    container_name: vendas_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_USER_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vendas_db
      DATABASE_URL_TEST: postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5432/vendas_db_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vendas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vendas-network

  redis:
    image: redis:7-alpine
    container_name: vendas_redis
    restart: always
    networks:
      - vendas-network

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: vendas_evolution
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution_db
      - AUTHENTICATION_API_KEY=${AUTHENTICATION_API_KEY}
      - CACHE_PROVIDER=redis
      - CACHE_REDIS_SERVER=redis://redis:6379
      - REDIS_URI=redis://redis:6379
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis:
        condition: service_started
        required: true
    networks:
      - vendas-network

volumes:
  postgres_data:
  evolution_instances:

networks:
  vendas-network:
    driver: bridge