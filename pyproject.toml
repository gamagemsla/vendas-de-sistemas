[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas"
version = "0.1.0"
description = "Ecossistema de prospecção B2B ativa, automação comercial via WhatsApp e IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.27",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "streamlit>=1.31.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.1",
    "mypy>=1.8.0",
    "import-linter>=2.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vendas*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["DTZ003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "google.*", "google.generativeai"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vendas.infrastructure.persistence.orm_models", "vendas.infrastructure.queue.outbox"]
disable_error_code = ["type-arg", "assignment"]